spring.application.name=sistemaPedagogico
# Lee las credenciales del archivo .env
spring.config.import=optional:file:.env[.properties],optional:file:./sistemaPedagogico/.env[.properties]


spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo maneja el script SQL, no Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false



admin.usuario=${ADMIN_USUARIO:}
admin.password=${ADMIN_PASSWORD:}

server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

compilador.url=${COMPILADOR_URL:http://localhost:8081}
compilador.token=${COMPILADOR_TOKEN:}

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/guali}
server.port=${PORT:8080}

server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}